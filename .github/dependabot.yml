version: 2

updates:
  # Keeps the pinned action SHAs in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci

  # Swift packages, declared in Packages/TrainrDependencies/Package.swift
  # because Dependabot cannot read packages declared in an Xcode project.
  - package-ecosystem: swift
    directory: /Packages/TrainrDependencies
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      firebase:
        patterns:
          - 'firebase-ios-sdk'

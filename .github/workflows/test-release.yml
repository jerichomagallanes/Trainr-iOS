name: Test release

# One deliberate merge, one candidate, one build. Fix and feature branches keep
# merging into version/X.Y, which is allowed to be noisy and gets no store
# build; when a candidate is worth testing, version/X.Y is merged into
# pre-release and that push builds it. Triggering on version/** instead would
# have meant thirteen builds and thirteen tester notifications in four days for
# a release that was unfinished at every one of those moments.
#
# This workflow stops at TestFlight. Production is reached by submitting this
# exact build with promote-to-production.yml, never by archiving again.
on:
  push:
    branches: [pre-release]
  workflow_dispatch:

concurrency:
  group: test-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # workflow_dispatch can start a run from any ref, and this workflow checks
      # out and builds whatever it is pointed at. A candidate only ever comes
      # from the candidate branch, so a run from anywhere else stops here rather
      # than shipping the wrong tree to testers.
      - name: Check this is the candidate branch
        run: |
          if [ "$GITHUB_REF_NAME" != "pre-release" ]; then
            echo "::error::Test release builds pre-release; got '$GITHUB_REF_NAME'."
            exit 1
          fi

      # Nothing is built until every secret is in hand. Without the API key the
      # archive would fall back to whatever signing identity the runner happens
      # to have, and without the Firebase plist the app ships with crash
      # reporting switched off and no symbols to read a crash with — both of
      # which succeed quietly rather than failing.
      - name: Check the release secrets are present
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          missing=()
          for name in GOOGLE_SERVICE_INFO_PLIST APP_STORE_CONNECT_KEY_ID \
                      APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_BASE64; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing repository secret %s\n' "${missing[@]}"
            echo "Create them under Settings -> Secrets and variables -> Actions."
            echo "docs/release-secrets.md says where each value comes from."
            exit 1
          fi

      # The marketing version is a repository variable rather than a value read
      # out of the project file: the committed MARKETING_VERSION is stale and is
      # not the source of truth, and the archive below passes the version on the
      # command line so the project file is never edited.
      - name: Check the marketing version is set and well formed
        env:
          MARKETING_VERSION: ${{ vars.MARKETING_VERSION }}
        run: |
          if [ -z "$MARKETING_VERSION" ]; then
            echo "::error::Missing repository variable MARKETING_VERSION"
            echo "Set it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          printf '%s\n' "$MARKETING_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$' || {
            echo "::error::MARKETING_VERSION must look like 1.2 or 1.2.3, got '$MARKETING_VERSION'."
            exit 1
          }

      # Shallow on purpose, unlike the Android repo and unlike release-smoke.yml.
      # Nothing here is derived from the commit count any more: the build number
      # comes from App Store Connect, below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner images ship a fastlane of their own. Pinning means an upstream
      # release cannot change what an upload does between two runs, and the
      # read-back catches the case where the gem installs somewhere that is not
      # what `fastlane` on PATH resolves to.
      - name: Install fastlane
        run: |
          sudo gem install --no-document fastlane -v 2.241.2
          installed=$(fastlane --version | sed -n 's/^fastlane \([0-9][0-9.]*\)$/\1/p' | tail -1)
          [ "$installed" = "2.241.2" ] || {
            echo "::error::fastlane on PATH is '$installed', not the pinned 2.241.2."
            exit 1
          }

      # One key, two consumers with different ideas of how to be given it:
      # xcodebuild wants the .p8 and the two ids as arguments, fastlane wants
      # them as a JSON file. jq builds the JSON so a newline or a quote in the
      # key cannot break out of it. Both land in RUNNER_TEMP, which is wiped
      # with the runner, never in the checkout.
      - name: Write the App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8" || {
            echo "::error::APP_STORE_CONNECT_KEY_BASE64 did not decode to a .p8 private key."
            exit 1
          }
          jq -n \
            --arg key_id "$APP_STORE_CONNECT_KEY_ID" \
            --arg issuer_id "$APP_STORE_CONNECT_ISSUER_ID" \
            --rawfile key "$RUNNER_TEMP/AuthKey.p8" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > "$RUNNER_TEMP/asc-api-key.json"

      # Trainr/Resources is a synchronized folder group, so dropping the file in
      # is enough for it to be bundled. Without it the app skips
      # FirebaseApp.configure() at launch and the archive's Crashlytics step
      # warns and uploads nothing — a release with no crash reporting at all,
      # arrived at without a single error.
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > Trainr/Resources/GoogleService-Info.plist
          plutil -lint Trainr/Resources/GoogleService-Info.plist

      # Asked of App Store Connect rather than derived from the commit count.
      # Re-archiving a commit is a normal thing to do while a candidate is being
      # tested, and a repeated build number is rejected on upload. No version
      # filter, so this is the last build uploaded for any version train and the
      # number only ever goes up.
      - name: Work out the next build number
        id: build
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_COLORS: '1'
        run: |
          set -o pipefail
          latest=$(fastlane run latest_testflight_build_number \
            app_identifier:com.jericx.trainr \
            api_key_path:"$RUNNER_TEMP/asc-api-key.json" \
            initial_build_number:0 \
            | sed -n 's/.*Result: \([0-9][0-9]*\)$/\1/p' | tail -1)
          case "$latest" in
            ''|*[!0-9]*)
              echo "::error::No build number in fastlane's output; refusing to guess one."
              exit 1
              ;;
          esac
          echo "number=$((latest + 1))" >> "$GITHUB_OUTPUT"

      # Both version numbers are passed here and nowhere else, so the project
      # file is never edited to make a release. -allowProvisioningUpdates with
      # the API key is what gets a distribution certificate and profile onto a
      # runner that has neither and no signed-in Xcode account.
      - name: Archive the Release build
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MARKETING_VERSION: ${{ vars.MARKETING_VERSION }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Trainr.xcodeproj \
            -scheme Trainr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Trainr.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify

      # manageAppVersionAndBuildNumber must stay false. Left to itself Xcode
      # rewrites the build number during export, and the number printed in the
      # summary below — the one a human types into the promotion workflow —
      # would not be the number inside the build.
      #
      # uploadSymbols sends dSYMs to Apple. Google's ad frameworks ship none, so
      # "Upload Symbols Failed" appears for them on every run and is expected;
      # the step fails on xcodebuild's exit status, never on a warning.
      - name: Export the App Store build
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>4S85RSFUW2</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Trainr.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            | xcbeautify

      # Before the upload, so a candidate that fails to reach App Store Connect
      # still leaves the exact signed binary behind to look at.
      - name: Upload the build to the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trainr-appstore-${{ steps.build.outputs.number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 90

      # pilot drives the same transporter Xcode uses and already handles its
      # retries. It uploads and stops: no beta review submission, nothing sent
      # to external testers, and nothing submitted for App Store review.
      - name: Upload to TestFlight
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          ipa=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          [ -n "$ipa" ] || {
            echo "::error::The export produced no .ipa; there is nothing to upload."
            exit 1
          }
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc-api-key.json" \
            --app_identifier com.jericx.trainr \
            --app_platform ios \
            --ipa "$ipa" \
            --skip_submission true \
            --skip_waiting_for_build_processing true \
            --distribute_external false \
            --notify_external_testers false

      - name: Say what to promote
        env:
          MARKETING_VERSION: ${{ vars.MARKETING_VERSION }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          {
            echo "### Candidate $MARKETING_VERSION ($BUILD_NUMBER)"
            echo
            echo "Uploaded to TestFlight. It reaches internal testers once App Store"
            echo "Connect finishes processing it."
            echo "To ship it, run **Promote to production** with build number \`$BUILD_NUMBER\`."
          } >> "$GITHUB_STEP_SUMMARY"

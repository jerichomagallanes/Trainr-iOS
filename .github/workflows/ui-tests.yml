name: UI tests

# UI tests need a booted simulator, so they are kept out of the CI workflow:
# they run automatically on every PR, but they are deliberately NOT a required
# check. Simulator flakes should never be able to block a merge on their own —
# read the result, re-run if it looks like a flake, investigate if it doesn't.
# The nightly run on main catches anything that slipped through.
#
# Nothing requires a pull request to be up to date with its base before merging,
# so two that were each green can land and break together. The push trigger on
# version/X.Y re-runs the suite on the merged result, which is the only thing
# that sees that combination. pre-release is listed because a candidate build
# goes to real testers, so a pull request into it is the last chance to catch
# anything that reached it without passing through version/X.Y.
#
# The nightly still runs against the default branch, because a schedule always
# does. Pointing it at version/X.Y would run that branch's tests against this
# file's shard list, which is a different branch's, and quietly skip whatever
# the two do not have in common.
#
# Split four ways and balanced by measured duration rather than test count, so
# the shards are numbered buckets rather than themes. Each shard runs serially
# on its own runner and carries about 12 minutes of checkout, build and boot
# before the first test, so rebalance from the durations in the uploaded
# .xcresult bundles when a shard starts creeping towards the timeout. Running
# clones side by side inside one job bought about 1.35x and cost a class of
# failure of its own, where a clone dies and reports every test in a file as
# failed. A test that fails is given one more attempt, because typing into a
# text field is where the hosted simulator stalls; a test that fails twice
# still fails the job. The published results honour that retry rather than
# reporting the discarded first attempt, and list what was retried so a flake
# stays visible instead of silent.
on:
  pull_request:
    branches: [main, version/2.0, pre-release]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  push:
    branches: [version/2.0]
  schedule:
    - cron: '0 18 * * *'  # 03:00 JST daily, against main
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro

jobs:
  ui-tests:
    name: UI tests (${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            classes: OnboardingScreenTests ExerciseSetTableScreenTests ProScreenTests GeneratingScreenTests PaywallScreenTests
          - shard: 2
            classes: RoutineDetailScreenTests PaywallGateTests CompletionScreenTests SplashAndOrientationTests TutorialFollowsItsExerciseTests
          - shard: 3
            classes: StaysWhereYouLeftItTests OnboardingFlowTests TimerFinishScreenTests WorkoutSetupScreenTests WeeklyProgressScreenTests PlanAfterEmptyingTests
          - shard: 4
            classes: AdjustContextScreenTests WeeklyPlanScreenTests BMISourcesScreenTests KeepsWhatYouTypedTests TrainrUITests UnstuckJourneyTests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every test class is in a shard
        run: scripts/check-ui-shards.sh

      - name: Run UI tests
        env:
          CLASSES: ${{ matrix.classes }}
        run: |
          set -o pipefail
          only=()
          for class in $CLASSES; do
            only+=("-only-testing:TrainrUITests/$class")
          done
          xcodebuild test \
            -project Trainr.xcodeproj \
            -scheme Trainr \
            -destination "$DESTINATION" \
            "${only[@]}" \
            -resultBundlePath UITestResults.xcresult \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            | xcbeautify --report junit --report-path build/reports

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: build/reports/junit.xml
          check_name: UI test results (${{ matrix.shard }})
          detailed_summary: true
          include_passed: false
          job_summary: true
          require_tests: false
          check_retries: true
          flaky_summary: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: UITestResults.xcresult
          retention-days: 14
